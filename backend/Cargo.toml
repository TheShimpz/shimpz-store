[package]
name = "store-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
license = "Apache-2.0"
description = "The platform Store service: public site, Assistant catalog projection, and the Cloudflare OAuth broker"

[lib]
name = "store_backend"
path = "src/lib.rs"

[[bin]]
name = "shimpz-store"
path = "src/main.rs"

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
bytes = "=1.12.1"
getrandom = "=0.4.3"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
http = "=1.5.0"
hmac = "=0.13.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
sha2 = "=0.11.0"
subtle = "=2.6.1"
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "=1.28.0", features = ["v4"] }
zeroize = "=1.9.1"

strict-json = { path = "../vendor/strict-json" }
team-protocol = { path = "../protocol/team/http" }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["test-util"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"
