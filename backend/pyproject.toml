[project]
name = "shimpz-store-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = ["httpx2==2.12.0", "pytest==9.1.1", "ruff==0.15.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
